name: README Update CI
on:
  push:
    paths:
      - "README.md"
    branches:
      - n3xus
  pull_request:
    paths:
      - "README.md"
jobs:
  lint-and-validate:
    name: Lint & Validate README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      - name: Lint README
        run: markdownlint README.md --config .markdownlint.json || true
      - name: Check for broken links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "no"
          file-path: "./README.md"
      - name: Verify README is not empty
        run: |
          if [ ! -s README.md ]; then
            echo "ERROR: README.md is empty."
            exit 1
          fi
          echo "README.md is non-empty. OK."
  notify-on-change:
    name: Notify README Changed
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Show README diff
        run: |
          echo "======= README.md CHANGES ======="
          git diff HEAD~1 HEAD -- README.md || echo "No previous commit to diff against."
      - name: Post summary to job summary
        run: |
          echo "## 📄 README.md was updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
